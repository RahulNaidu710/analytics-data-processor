services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:23.3.1
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  smoke:
    build:
      context: .
      target: tests
    platform: linux/amd64
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: ["python", "-m", "scripts.local_smoke"]

networks:
  default:
    internal: true
